<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мемориал питомцев</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        body, html { margin: 0; padding: 0; min-height: 100vh; font-family: 'Montserrat', sans-serif; color: white; }
        .background { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.6)), url('forest.jpg') no-repeat center center fixed; 
            background-size: cover; background-color: #1a2a1a; z-index: -1; 
        }
        /* Контейнер на всю ширину экрана */
        .container { width: 95%; max-width: 100%; margin: 0 auto; padding: 50px 0; text-align: center; }
        h1 { font-family: 'Lora', serif; font-size: clamp(2rem, 5vw, 3rem); margin-bottom: 30px; text-shadow: 2px 2px 10px rgba(0,0,0,0.7); }
        .controls { margin-bottom: 40px; display: flex; justify-content: center; gap: 15px; flex-wrap: wrap; }
        .btn, .sort-select { background: rgba(255, 255, 255, 0.15); border: 1px solid rgba(255,255,255,0.4); color: white; padding: 12px 25px; border-radius: 50px; cursor: pointer; backdrop-filter: blur(10px); font-family: inherit; font-size: 0.9rem; }
        .sort-select option { color: #333; background: white; }
        .graveyard { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 25px; width: 100%; }
        .pet-card { background: rgba(0, 0, 0, 0.55); backdrop-filter: blur(12px); padding: 30px 15px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.1); position: relative; transition: 0.3s; min-height: 240px; display: flex; flex-direction: column; justify-content: center; }
        .pet-photo { width: 100px; height: 100px; border-radius: 50%; margin: 0 auto 15px; object-fit: cover; border: 2px solid white; display: block; }
        .pet-type-text { height: 100px; display: flex; align-items: center; justify-content: center; margin-bottom: 15px; font-style: italic; opacity: 0.8; font-size: 1.1rem; }
        .pet-name { font-family: 'Lora', serif; font-size: 1.4rem; margin-bottom: 5px; }
        .pet-dates { font-size: 0.85rem; opacity: 0.6; }
        .edit-badge { position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%); font-size: 0.7rem; background: rgba(255,255,255,0.2); padding: 4px 12px; border-radius: 10px; cursor: pointer; border: none; color: white; }
        .del-btn { display: none; position: absolute; top: 10px; right: 10px; background: #ff4757; color: white; border: none; border-radius: 50%; width: 26px; height: 26px; cursor: pointer; z-index: 5; }
        #modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); justify-content: center; align-items: center; z-index: 1000; }
        .form-content { background: white; color: #333; padding: 30px; border-radius: 25px; width: 90%; max-width: 380px; text-align: left; }
        .form-content input, .form-content select { width: 100%; padding: 12px; margin: 8px 0 15px 0; border-radius: 10px; border: 1px solid #ddd; box-sizing: border-box; }
        #previewContainer { text-align: center; margin-bottom: 15px; display: none; }
        #previewImg { width: 100px; height: 100px; border-radius: 50%; object-fit: cover; border: 2px solid #2d3436; }
    </style>
</head>
<body>

<div class="background"></div>
<div class="container">
    <h1>Кладбище домашних животных</h1>
    <div class="controls">
        <button class="btn" onclick="openAddModal()">Добавить друга</button>
        <select class="sort-select" id="sortSelect" onchange="render()">
            <option value="new">Сначала новые</option>
            <option value="name">По имени (А-Я)</option>
            <option value="birth">По году рождения</option>
            <option value="death">По году ухода</option>
        </select>
    </div>
    <div class="graveyard" id="petGrid">Загрузка воспоминаний...</div>
</div>

<div id="modal">
    <div class="form-content">
        <h2 id="modalTitle" style="margin-top:0; font-family:'Lora'">Память о питомце</h2>
        <div id="previewContainer">
            <img id="previewImg" src=""><p style="font-size:0.7rem; color: #666; margin: 5px 0;">Так будет выглядеть мордочка</p>
        </div>
        <input type="text" id="name" placeholder="Кличка...">
        <select id="type">
            <option value="Кошка">Кошка</option><option value="Собака">Собака</option><option value="Птица">Птица</option><option value="Рыбка">Рыбка</option><option value="Паук">Паук</option><option value="Лошадь">Лошадь</option><option value="Рептилия">Рептилия</option><option value="Грызун">Грызун</option><option value="Черепаха">Черепаха</option>
        </select>
        <div style="display:flex; gap:10px"><input type="number" id="birth" placeholder="Рождение"><input type="number" id="death" placeholder="Уход"></div>
        <label style="font-size:0.8rem; color:#666">Фото (мордочка):</label>
        <input type="file" id="photoInput" accept="image/*" onchange="handleFileSelect(this)">
        <button class="btn" style="background:#2d3436; width:100%; color:white; margin-top: 10px;" onclick="savePet()">Сохранить</button>
        <button onclick="toggleModal(false)" style="width:100%; background:none; border:none; margin-top:10px; color:gray; cursor:pointer;">Отмена</button>
    </div>
</div>

<div onclick="toggleAdminMode()" style="position:fixed; bottom:5px; right:5px; width:20px; height:20px; opacity:0.05; cursor:pointer;">.</div>

<script type="module">
    import { initializeApp } from "https://gstatic.com";
    import { getDatabase, ref, push, onValue, set, remove } from "https://gstatic.com";

    // ТВОИ ДАННЫЕ FIREBASE
    const firebaseConfig = {
      apiKey: "AIzaSyAQgX2b42sAylvzjBsPncYG8cJTvp2ZFAo",
      authDomain: "://firebaseapp.com",
      projectId: "petsmemorial-7dc35",
      storageBucket: "petsmemorial-7dc35.firebasestorage.app",
      messagingSenderId: "24836560758",
      appId: "1:24836560758:web:fb91289f5365058eb50c57"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const petsRef = ref(db, 'pets');

    let pets = [];
    let adminMode = false;
    let editingId = null;
    let currentBase64 = null;

    // --- ТВОЙ СПИСОК ЗАПРЕЩЕННЫХ СЛОВ ---
    const forbidden = ["хуй", "пизд", "ебл", "сук", "бля", "уеб", "залуп", "гандон", "чмо", "курва", "пидор", "виноград", "капуста", "сырник"];

    onValue(petsRef, (snapshot) => {
        const data = snapshot.val();
        pets = data ? Object.keys(data).map(key => ({...data[key], fireId: key})) : [];
        render();
    });

    window.render = function() {
        const grid = document.getElementById('petGrid');
        const sort = document.getElementById('sortSelect').value;
        grid.innerHTML = '';
        let list = [...pets];
        
        if(sort === 'name') list.sort((a,b) => a.name.localeCompare(b.name));
        else if(sort === 'birth') list.sort((a,b) => a.birth - b.birth);
        else if(sort === 'death') list.sort((a,b) => a.death - b.death);
        else list.sort((a,b) => b.id - a.id);

        const now = Date.now();
        list.forEach((pet) => {
            const media = pet.photo ? `<img src="${pet.photo}" class="pet-photo">` : `<div class="pet-type-text">${pet.type}</div>`;
            const canEdit = (now - pet.id) < 120000;
            grid.innerHTML += `<div class="pet-card"><button class="del-btn" style="display:${adminMode ? 'block' : 'none'}" onclick="removePet('${pet.fireId}')">×</button>${media}<div class="pet-name">${pet.name}</div><div class="pet-dates">${pet.birth} — ${pet.death}</div>${canEdit ? `<button class="edit-badge" onclick="editPet('${pet.fireId}')">Изменить (2 мин)</button>` : ''}</div>`;
        });
    }

    window.savePet = function() {
        const name = document.getElementById('name').value.trim();
        const birth = parseInt(document.getElementById('birth').value);
        const death = parseInt(document.getElementById('death').value);
        const type = document.getElementById('type').value;

        if (!name || !birth || !death) return alert("Заполните кличку и даты");
        const isBad = forbidden.some(word => name.toLowerCase().includes(word.toLowerCase()));
        if (isBad) return alert("Пожалуйста, используйте корректное имя");

        const petData = { 
            id: editingId ? pets.find(p => p.fireId === editingId).id : Date.now(), 
            name, birth, death, type, photo: currentBase64 
        };

        if(editingId) {
            set(ref(db, 'pets/' + editingId), petData);
        } else {
            push(petsRef, petData);
        }
        toggleModal(false);
    }

    window.handleFileSelect = function(input) {
        if (input.files && input.files[0]) {
            const reader = new FileReader();
            reader.onload = (e) => { 
                currentBase64 = e.target.result; 
                document.getElementById('previewImg').src = currentBase64; 
                document.getElementById('previewContainer').style.display = 'block'; 
            };
            reader.readAsDataURL(input.files[0]);
        }
    }

    window.removePet = function(fireId) { if(confirm("Удалить запись?")) remove(ref(db, 'pets/' + fireId)); }
    
    window.editPet = function(fireId) {
        const pet = pets.find(p => p.fireId === fireId);
        editingId = fireId;
        document.getElementById('modalTitle').innerText = "Редактирование";
        document.getElementById('name').value = pet.name;
        document.getElementById('birth').value = pet.birth;
        document.getElementById('death').value = pet.death;
        document.getElementById('type').value = pet.type;
        currentBase64 = pet.photo;
        if(pet.photo) { document.getElementById('previewImg').src = pet.photo; document.getElementById('previewContainer').style.display = 'block'; }
        else { document.getElementById('previewContainer').style.display = 'none'; }
        toggleModal(true);
    }

    window.openAddModal = function() { 
        editingId = null; currentBase64 = null; 
        document.getElementById('modalTitle').innerText = "Память о питомце"; 
        document.getElementById('name').value = ''; document.getElementById('birth').value = ''; document.getElementById('death').value = ''; 
        document.getElementById('previewContainer').style.display = 'none'; 
        document.getElementById('photoInput').value = '';
        toggleModal(true); 
    }
    
    window.toggleAdminMode = function() { if (prompt("Пароль:") === "1234") { adminMode = !adminMode; render(); } }
    window.toggleModal = function(show) { document.getElementById('modal').style.display = show ? 'flex' : 'none'; }
    
    setInterval(render, 30000);
</script>
</body>
</html>
